[package]
name = "template-rust-project"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "github.com/tomaschochola/template-rust-project"
license = "BSD-3-Clause"
publish = false

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
